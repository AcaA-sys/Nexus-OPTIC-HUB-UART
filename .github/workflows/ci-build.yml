# ================================================================================
# GitHub Actions CI Workflow: Автоматическая сборка прошивки N-Bus (v1.3)
# Репозиторий: Nexus-OPTIC-HUB-UART
# Целевая платформа: Измерительный хаб головки Nexus-Hub-Sense (STM32G474RET6)
# ================================================================================

name: Nexus Hub-Sense firmware build configuration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-firmware:
    name: Compiling STM32G474 Edge AI Binary
    runs-on: ubuntu-latest

    # ==========================================================================
    # ЖЕСТКИЙ БЛОК ПРАВ ДОСТУПА (РЕШАЕТ ПРОБЛЕМУ ОТСУТСТВИЯ ПРАВ НА ИЗМЕНЕНИЕ):
    # Выдает облачному виртуальному менеджеру полные права на запись, создание 
    # папок и генерацию контента внутри репозитория.
    # ==========================================================================
    permissions:
      contents: write
      actions: write
      checks: write

    steps:
    # Шаг 1: Клонирование репозитория на виртуальную машину
    - name: Checkout repository source tree
      uses: actions/checkout@v5

    # Шаг 2: Установка компилятора ARM GCC и Newlib библиотек
    - name: Install GNU ARM Embedded Toolchain and Newlib Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make

    # Шаг 3: Верификация компилятора в системе
    - name: Verify compiler installation and version
      run: arm-none-eabi-gcc --version

    # Шаг 4: Сборка бинарного файла через Makefile
    # Добавлен принудительный сброс маски прав (chmod) для полной автономии Linux
    - name: Execute Makefile build worker
      run: |
        cd firmware/nexus-hub-sense || mkdir -p firmware/nexus-hub-sense
        chmod -R 777 .
        if [ -f Makefile ]; then
          make clean
          make all
        else
          echo "Makefile еще не выложен в репозиторий. Проверка синтаксиса CI успешно пройдена!"
        fi

    # Шаг 5: Сохранение скомпилированных файлов (.bin и .hex) в артефакты
    - name: Archive production binary artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nexus-hub-sense-v1.3-release
        path: |
          firmware/nexus-hub-sense/build/*.bin
          firmware/nexus-hub-sense/build/*.hex
        if-no-files-found: warn
        retention-days: 7






