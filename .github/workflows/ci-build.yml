# ================================================================================
# GitHub Actions CI Workflow: Автоматическая сборка прошивки N-Bus (v1.3)
# Репозиторий: Nexus-OPTIC-HUB-UART
# Целевая платформа: Измерительный хаб головки Nexus-Hub-Sense (STM32G474RET6)
# ================================================================================

name: Nexus Hub-Sense firmware build configuration



on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ARM Toolchain
      uses: gcc-arm-embedded/program-an-embedded-system-action@v1.1.0

    - name: Build Project
      run: make -j$(nproc)


