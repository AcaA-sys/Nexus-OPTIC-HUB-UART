# ================================================================================
# GitHub Actions CI Workflow: Автоматическая сборка прошивки N-Bus (v1.3)
# Репозиторий: Nexus-OPTIC-HUB-UART
# Целевая платформа: Измерительный хаб головки Nexus-Hub-Sense (STM32G474RET6)
# ================================================================================

name: Nexus Hub-Sense firmware build configuration

# Контур триггеров: запуск сборки при любом push или pull-request в главную ветку
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-firmware:
    name: Compiling STM32G474 Edge AI Binary
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Аппаратное клонирование репозитория на виртуальную машину Ubuntu
    - name: Checkout repository source tree
      uses: actions/checkout@v4

    # Шаг 2: Развертывание официального компилятора GNU Arm Embedded Toolchain
    - name: Install GNU ARM Embedded Toolchain (gcc-arm-none-eabi)
      uses: arm-software/app-action-install-arm-gcc@v1
      with:
        release: 'latest' # Автоматический выбор стабильной версии компилятора Cortex-M4

    # Шаг 3: Верификация установленного компилятора в системе
    - name: Verify compiler installation and version
      run: arm-none-eabi-gcc --version

    # Шаг 4: Сборка бинарного файла через стандартную утилиту Make
    # (Скрипт компилирует проект, опираясь на driver_virtual_map.h и hub_main.c)
    - name: Execute Makefile build worker
      run: |
        cd firmware/nexus-hub-sense
        make clean
        make all

    # Шаг 5: Архивация и сохранение скомпилированных файлов (.bin и .hex) в артефакты GitHub
    # Длительность хранения артефактов жестко ограничена для экономии дискового пространства
    - name: Archive production binary artifacts
      uses: actions/artifacts@v4
      with:
        name: nexus-hub-sense-v1.3-release
        path: |
          firmware/nexus-hub-sense/build/*.bin
          firmware/nexus-hub-sense/build/*.hex
        retention-days: 7

